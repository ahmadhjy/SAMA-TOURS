{% load static i18n %}
<header class="site-header" id="site-header">
    <div class="container header-inner">
        <a href="{% url 'website:home' %}" class="logo" aria-label="{% trans 'Sama Tours — Home' %}">
            <img src="{% static 'media/logo.png' %}" alt="Sama Tours" class="logo-img" width="80" height="72">
        </a>
        <nav class="main-nav" id="main-nav">
            <ul>
                <li><a href="{% url 'website:home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>{% trans 'Home' %}</a></li>
                <li><a href="{% url 'website:about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>{% trans 'About' %}</a></li>
                <li><a href="{% url 'website:packages' %}" {% if request.resolver_match.url_name == 'packages' %}class="active"{% endif %}>{% trans 'Packages' %}</a></li>
                <li><a href="{% url 'website:visa' %}" {% if request.resolver_match.url_name == 'visa' %}class="active"{% endif %}>{% trans 'Visa Requirements' %}</a></li>
                <li><a href="{% url 'website:flight_match' %}" {% if request.resolver_match.url_name == 'flight_match' %}class="active"{% endif %}>{% trans 'Sama Match' %}</a></li>
                <li><a href="{% url 'website:contact' %}" class="nav-cta {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">{% trans 'Contact Us' %}</a></li>
            </ul>
        </nav>
        <div class="header-end">
            <details class="lang-switcher" id="language-picker">
                <summary class="lang-trigger" aria-label="{% trans 'Language' %}" title="{% trans 'Language' %}">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
                        <path d="M3 12h18"></path>
                    </svg>
                </summary>
                <nav class="lang-menu" aria-label="{% trans 'Language' %}">
                {% for lang in LANGUAGE_SWITCHER %}
                {% if not lang.active %}
                <a href="{{ lang.url }}" class="lang-flag" title="{{ lang.label }}" hreflang="{{ lang.code }}" lang="{{ lang.code }}">
                    <img src="{% static lang.flag_icon %}" alt="" class="lang-flag__icon" width="20" height="14" loading="lazy" decoding="async">
                    <span class="lang-flag__label">{{ lang.label }}</span>
                </a>
                {% endif %}
                {% endfor %}
                </nav>
            </details>
            <button class="nav-toggle" id="nav-toggle" aria-label="{% trans 'Toggle navigation' %}" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>
